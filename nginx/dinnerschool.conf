# Copia este archivo a /etc/nginx/sites-available/dinnerschool en el VPS,
# reemplaza el dominio, y:
#   sudo ln -s /etc/nginx/sites-available/dinnerschool /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cafeteriacerto.com -d www.cafeteriacerto.com

server {
    listen 80;
    server_name cafeteriacerto.com www.cafeteriacerto.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del kanban (notificaciones en vivo) — necesita el upgrade
    # de protocolo, si falta este bloque el sitio carga bien pero el kanban
    # nunca conecta el socket.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
