# Copia este archivo a /etc/nginx/sites-available/dinnerschool en el VPS y:
#   sudo ln -s /etc/nginx/sites-available/dinnerschool /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado ya está emitido (/etc/letsencrypt/live/cafeteriacerto.com/),
# así que este archivo ya trae el bloque SSL — no hace falta correr certbot
# de nuevo, solo referenciar los archivos que ya existen.

server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name cafeteriacerto.com www.cafeteriacerto.com;

    ssl_certificate /etc/letsencrypt/live/cafeteriacerto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafeteriacerto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del kanban (notificaciones en vivo) — necesita el upgrade
    # de protocolo, si falta este bloque el sitio carga bien pero el kanban
    # nunca conecta el socket.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    if ($host = www.cafeteriacerto.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = cafeteriacerto.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name cafeteriacerto.com www.cafeteriacerto.com;
    return 404;
}
